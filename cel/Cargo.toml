[package]
name = "cel"
description = "A parser and interpreter for the Common Expression Language (CEL)"
repository = "https://github.com/cel-rust/cel-rust"
version = "0.14.2"
authors = ["Clark McCauley <me@clarkmccauley.com>", "Alex Snaps <alex@wcgw.dev>"]
edition = "2021"
rust-version = "1.86.0"
license = "MIT"
categories = ["compilers"]

[dependencies]
antlr4rust = "0.5.2"
lazy_static = "1.5.0"
nom = "7.1.3"
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde", "clock"], optional = true }
regex = { version = "1.10.5", optional = true }
serde = "1.0"
serde_json = { version = "1.0", optional = true }
base64 = { version = "0.22.1", optional = true }
bytes = { version = "1", optional = true }

thiserror = "2"
pastey = "0.2.1"

# PoC meta-tracing JIT tier (feature `majit-jit`). The `majit` crates live in a
# separate workspace two levels up, so these are cross-workspace path deps.
majit-ir = { path = "../../majit/majit-ir", optional = true }
majit-macros = { path = "../../majit/majit-macros", optional = true }
majit-metainterp = { path = "../../majit/majit-metainterp", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
serde_bytes = "0.11.14"
dhat = { version = "0.3.3" }

[[bench]]
name = "runtime"
harness = false

[[example]]
name = "majit_ab"
required-features = ["majit-jit"]

[[example]]
name = "majit_vs_cometkim"
required-features = ["majit-jit"]

[[example]]
name = "majit_columnar_batch"
required-features = ["majit-jit"]

[[example]]
name = "majit_columnar_batch_float"
required-features = ["majit-jit"]

[[example]]
name = "majit_columnar_batch_uint"
required-features = ["majit-jit"]

[[example]]
name = "majit_columnar_batch_string"
required-features = ["majit-jit"]

[features]
default = ["regex", "chrono"]
structs = []
bytes = ["dep:bytes"]
json = ["dep:serde_json", "dep:base64"]
regex = ["dep:regex"]
chrono = ["dep:chrono"]
dhat-heap = [ ] # if you are doing heap profiling

# PoC: meta-tracing JIT tier built on the in-repo `majit` framework (cell-majit,
# issue #357). Additive and off by default. Applies majit's RPython-style
# meta-tracer to a traceable CEL evaluation mainloop.
majit-jit = [
    "dep:majit-ir",
    "dep:majit-macros",
    "dep:majit-metainterp",
    "majit-metainterp/cranelift",
]
