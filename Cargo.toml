[workspace]
members = ["cel", "census", "example", "fuzz"]
# `census` is a member but not a default one: it pulls `majit-translate`,
# which none of the other three need, and a bare `cargo build`/`cargo test`
# at the root would then compile the whole translator. Run it with
# `-p cel-census`.
default-members = ["cel", "example", "fuzz"]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
# Line numbers for dhat
debug = 1
